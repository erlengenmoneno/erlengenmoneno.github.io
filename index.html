<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO -->
    <title>Erlengen Moneño - Digital Design</title>

    <meta
      name="description"
      content="One Design. Endless Sales. Digital designer creating print-on-demand graphics, Canva templates, children's books, coloring books, video edits, and digital products for online marketplaces."
    />

    <meta name="author" content="Erlengen Moneño" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#F4F4ED" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Erlengen Moneño" />
    <meta property="og:title" content="Erlengen Moneño - Digital Design" />

    <meta
      property="og:description"
      content="One Design. Endless Sales. Original designs for print-on-demand and digital marketplaces."
    />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark'
              ? 'dark'
              : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }

        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector(
            'meta[name="theme-color"]'
          );

          if (bar) {
            bar.setAttribute('content', '#070B14');
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
